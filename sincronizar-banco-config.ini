# Configuracao do sincronizar-banco (pode editar com o Bloco de Notas).
# Linhas que comecam com # sao comentarios. Nao coloque senhas nem tokens aqui.
#
# Pendrive: pasta do app no pendrive. {LETRA} = o script procura em todas as letras (D:, E:, F:...).
# Pode repetir a linha para outros caminhos; vale o primeiro que existir.
Pendrive={LETRA}:\Trampo\Ultra-formulario (Zenacto)

# Google Drive: pasta do app dentro do Google Drive para computador (a mesma pasta que aparece no Drive).
# Pode repetir a linha; vale o primeiro caminho que existir.
Drive=%USERPROFILE%\Meu Drive\Trampo\Ultra-formulario (Zenacto)
Drive=%USERPROFILE%\My Drive\Trampo\Ultra-formulario (Zenacto)
Drive=G:\Meu Drive\Trampo\Ultra-formulario (Zenacto)
Drive=G:\My Drive\Trampo\Ultra-formulario (Zenacto)

# GitHub (repositorio PRIVADO so do banco). Precisa do Git instalado e da conta GitHub ja logada.
# GitHubLocal = pasta onde o script guarda uma copia do repositorio neste computador.
GitHubRepo=https://github.com/Renato2707/ultra-formulario-banco.git
GitHubLocal=%USERPROFILE%\ultra-formulario-banco

# Backups: AUTO = pasta "Ultra-formulario (backups)\banco" ao lado da pasta do app (no pendrive; se ele
# nao estiver, no Drive; se nenhum, em %USERPROFILE%\ultra-formulario-banco-backups).
# Ou escreva um caminho completo.
Backups=AUTO
# Quantos backups guardar (os mais recentes). Cada backup e uma pasta com data e hora.
GuardarBackups=20

# Seguranca: nao copia se o arquivo mais novo for vazio ou menor que esta porcentagem do maior.
PorcentagemMinima=50
